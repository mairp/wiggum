# Wiggum OPTIONAL telemetry stack — self-contained Loki + Grafana with the
# "Ralph Loops" dashboard pre-provisioned. Off by default; only relevant when you
# run the orchestrator with --telemetry.
#
# This is a NEW, INDEPENDENT deployment. It binds ports that are free on this
# machine (the host's own observability stack already uses :3000 Grafana /
# :3100 Loki), so the defaults below deliberately avoid them. Every port is an
# .env variable — a collision is a one-line change.
#
#   cd telemetry && docker compose up -d
#   open http://localhost:${WIGGUM_GRAFANA_PORT:-3010}   (anonymous, Admin)
#   ./orchestrator.sh --telemetry --loki-url http://localhost:${WIGGUM_LOKI_PORT:-3110} ...
#   ./orchestrator.sh --otel     --otel-url http://localhost:${WIGGUM_OTEL_PORT:-4318} ...
#   docker compose down            # stop; add -v to wipe volumes
#
# The optional OTEL path (--otel) sends OTLP to the collector, which forwards logs to
# the SAME Loki (so the existing dashboard keeps working) and exposes metrics for the
# bundled Prometheus. Both telemetry backends can run at once (dual-ship).

name: wiggum-telemetry

services:
  loki:
    image: grafana/loki:3.1.1
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "${WIGGUM_LOKI_PORT:-3110}:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  # OTEL Collector — receives OTLP/HTTP (and gRPC) from lib/ralph_otel_ship.py,
  # forwards logs to the existing Loki and exposes metrics for Prometheus. Only
  # needed for --otel runs; harmless to leave running otherwise.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    command: ["--config=/etc/otelcol/collector-config.yaml"]
    ports:
      - "${WIGGUM_OTEL_PORT:-4318}:4318"     # OTLP/HTTP (what the shipper posts to)
      - "${WIGGUM_OTEL_GRPC_PORT:-4317}:4317" # OTLP/gRPC (unused by the shipper, exposed for convenience)
    volumes:
      - ./otel/collector-config.yaml:/etc/otelcol/collector-config.yaml:ro
    depends_on:
      - loki
    restart: unless-stopped

  # Prometheus — scrapes the collector's metrics endpoint so ralph.* metrics are
  # queryable in Grafana (the Prometheus datasource is provisioned alongside Loki).
  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "${WIGGUM_PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - otel-collector
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "${WIGGUM_GRAFANA_PORT:-3010}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_USERS_DEFAULT_THEME: "dark"
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  loki-data:
  grafana-data:
  prometheus-data:
